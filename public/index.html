<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intake Grader</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --line: #30363d;
        --text: #e6edf3;
        --dim: #8b949e;
        --good: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        --accent: #58a6ff;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de;
          --text: #1f2328; --dim: #656d76; --accent: #0969da;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
        padding: 16px 20px; border-bottom: 1px solid var(--line);
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .pill {
        font: 11px/1 var(--mono); padding: 4px 8px; border-radius: 10px;
        border: 1px solid var(--line); color: var(--dim);
      }
      .pill.on { color: var(--good); border-color: var(--good); }
      .pill.off { color: var(--bad); border-color: var(--bad); }
      main { padding: 20px; display: grid; gap: 20px; grid-template-columns: minmax(320px, 420px) 1fr; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--dim); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line);
      }
      .runs { max-height: 70vh; overflow-y: auto; }
      .run {
        padding: 12px 14px; border-bottom: 1px solid var(--line);
        cursor: pointer; display: grid; gap: 4px;
      }
      .run:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .run[aria-selected='true'] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .run-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .name { font-weight: 600; }
      .meta { font: 11px/1.4 var(--mono); color: var(--dim); }
      .rank { font: 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
      .r1, .r2, .r3 { color: var(--good); border-color: var(--good); }
      .r4, .r5 { color: var(--warn); border-color: var(--warn); }
      .r6, .r7, .r8, .r9, .r10 { color: var(--bad); border-color: var(--bad); }
      .detail { padding: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .stat { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
      .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
      .stat .v { font: 16px/1.3 var(--mono); margin-top: 4px; }
      .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      @media (max-width: 620px) { .scores { grid-template-columns: 1fr; } }
      .score { border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
      .score h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
      .score .big { font: 22px/1 var(--mono); }
      .transcript { display: grid; gap: 8px; }
      .msg { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); max-width: 82%; }
      .msg.out { margin-left: auto; background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .msg.in { background: var(--bg); }
      .msg .who { font: 10px/1 var(--mono); color: var(--dim); margin-bottom: 4px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; }
      .empty { padding: 28px 14px; color: var(--dim); text-align: center; }
      code { font: 12px/1.4 var(--mono); color: var(--dim); }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <header>
      <h1>Intake Grader</h1>
      <span class="pill" id="p-adapter">adapter …</span>
      <span class="pill" id="p-judge">judge …</span>
      <span class="pill" id="p-sends">sends …</span>
      <span class="pill" id="p-persona">persona …</span>
    </header>

    <main>
      <section>
        <h2>Runs</h2>
        <div class="runs" id="runs"><div class="empty">loading…</div></div>
      </section>
      <section>
        <h2>Scorecard</h2>
        <div class="detail" id="detail"><div class="empty">select a run</div></div>
      </section>
    </main>

    <script type="module">
      const el = (id) => document.getElementById(id);
      let selected = null;

      const fmtMin = (m) => (m === null || m === undefined ? '—' : m < 60 ? `${m}m` : `${(m / 60).toFixed(1)}h`);
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      async function loadHealth() {
        try {
          const h = await (await fetch('/api/health')).json();
          el('p-adapter').textContent = `adapter ${h.adapter}`;
          const j = h.judge ?? {};
          el('p-judge').textContent = `judge ${j.driver}${j.model && j.model !== '-' ? ` ${j.model}` : ''}`;
          el('p-judge').className = `pill ${j.driver === 'http' ? 'on' : 'off'}`;
          el('p-judge').title = j.reason ?? '';
          const sending = h.live_sends && !h.sends_halted;
          el('p-sends').textContent = h.sends_halted ? 'sends HALTED' : `live sends ${h.live_sends}`;
          el('p-sends').className = `pill ${sending ? 'on' : 'off'}`;
          el('p-persona').textContent = `${h.persona?.name ?? '—'} [${(h.persona?.need_tags ?? []).join(', ')}]`;
        } catch {
          el('p-adapter').textContent = 'router unreachable';
        }
      }

      async function loadRuns() {
        const { runs } = await (await fetch('/api/runs')).json();
        if (!runs.length) {
          el('runs').innerHTML = '<div class="empty">no runs yet</div>';
          return;
        }
        el('runs').innerHTML = runs
          .map((r) => {
            const rank = r.outcome?.rank;
            return `<div class="run" data-id="${r.id}" aria-selected="${r.id === selected}">
              <div class="run-top">
                <span class="name">${esc(r.target_name ?? r.target_domain ?? r.target_id)}</span>
                ${rank ? `<span class="rank r${rank}">${esc(r.terminal_state)}</span>` : `<span class="rank">${esc(r.state)}</span>`}
              </div>
              <div class="meta">${r.qualified ? 'qualified' : 'unqualified'} · ${r.turns} turns · ${esc(r.channel ?? '—')}${r.live ? ' · live' : ''}</div>
            </div>`;
          })
          .join('');
        for (const node of el('runs').querySelectorAll('.run')) {
          node.onclick = () => {
            selected = node.dataset.id;
            loadRuns();
            loadDetail(selected);
          };
        }
      }

      async function loadDetail(id) {
        const d = await (await fetch(`/api/runs/${id}`)).json();
        if (!d.ok) return;
        const { run, target, transcript, outcome } = d;
        const card = run.scorecard;

        const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
        const stats = [
          stat('state', esc(run.state)),
          stat('outcome', run.terminal_state ? `${esc(run.terminal_state)}<br><span class="meta">rank ${outcome?.rank}</span>` : '—'),
          stat('qualified', run.qualified ? 'yes' : 'no'),
          stat('turns', run.turns),
          stat('first reply', card ? fmtMin(card.latency.first_reply_business_minutes ?? card.latency.first_reply_raw_minutes) : run.first_reply_at ? 'see transcript' : '—'),
          stat('first human', run.first_human_at ? (card ? fmtMin(card.latency.first_human_business_minutes) : 'yes') : 'never'),
          stat('bot turns first', run.turns_in_automation ?? '—'),
          stat('nudges', run.nudges_sent),
        ].join('');

        const promise = run.promise_made_at
          ? `<tr><th>promise</th><td>"${esc(run.promise_window_text)}" due ${esc(run.promise_deadline)} —
             <strong>${run.promise_kept === null ? 'unresolved' : run.promise_kept ? 'kept' : 'BROKEN'}</strong></td></tr>`
          : '';

        const scores = card
          ? `<div class="scores">
               <div class="score"><h3>Harness score</h3>
                 <div class="big">${card.harness_score.completed_mission ? 'PASS' : 'FAIL'}</div>
                 <div class="meta">${esc(card.harness_score.reason)}</div></div>
               <div class="score"><h3>Business score</h3>
                 <div class="big">${esc(card.business_score.grade)}</div>
                 <div class="meta">${card.business_score.reasons.map(esc).join('<br>')}</div></div>
             </div>
             <div class="scroll"><table>
               <tr><th>screening</th><td>${esc(card.screening.verdict)} — ${esc(card.screening.note)}</td></tr>
               <tr><th>graded on</th><td>${esc(card.latency.graded_on)} time (hours confidence: ${esc(card.latency.hours_confidence)})</td></tr>
               <tr><th>narrative</th><td>${esc(card.narrative ?? '—')}</td></tr>
             </table></div>`
          : '<div class="meta" style="margin-bottom:16px">scorecard is generated when the run reaches a terminal state</div>';

        const rows = `<div class="scroll"><table>
            <tr><th>target</th><td>${esc(target?.name)} — <code>${esc(target?.url)}</code></td></tr>
            <tr><th>services</th><td>${(target?.services ?? []).map(esc).join(', ') || '—'}</td></tr>
            <tr><th>hours</th><td>${esc(target?.stated_hours_text ?? '—')} · ${esc(target?.timezone)} · confidence ${esc(target?.hours_confidence)}${target?.claims_247 ? ' · claims 24/7' : ''}</td></tr>
            <tr><th>channel</th><td>${esc(run.channel)} → <code>${esc(run.channel_address)}</code></td></tr>
            <tr><th>qualification</th><td>${esc(run.qualification_reason)}</td></tr>
            ${promise}
            ${run.terminal_reason ? `<tr><th>closed because</th><td>${esc(run.terminal_reason)}</td></tr>` : ''}
          </table></div>`;

        const msgs = transcript
          .map(
            (m) => `<div class="msg ${m.direction}">
              <div class="who">${m.direction === 'out' ? 'persona' : `business${m.sender_type ? ` · ${esc(m.sender_type)}` : ''}`}
                · ${esc(m.ts.slice(11, 19))}${m.classifier ? ` · ${esc(m.classifier)}` : ''}</div>
              ${esc(m.body)}</div>`,
          )
          .join('');

        el('detail').innerHTML = `<div class="grid">${stats}</div>${scores}${rows}
          <h2 style="padding-left:0;border:0;margin-top:18px">Transcript</h2>
          <div class="transcript">${msgs || '<div class="empty">nothing sent yet</div>'}</div>`;
      }

      async function tick() {
        await loadHealth();
        await loadRuns();
        if (selected) await loadDetail(selected);
      }
      tick();
      setInterval(tick, 5000);
    </script>
  </body>
</html>
